name: Refresh writeups catalog

# Cron: lunes a las 06:00 UTC (≈ 08:00 Madrid en invierno, 07:00 en verano).
# El "workflow_dispatch" permite lanzarlo a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Invalidar caché antes de regenerar"
        type: boolean
        default: false

permissions:
  contents: write  # necesario para que el bot commitee de vuelta

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetch]"
          # Browser para la fase TryHackMe (Playwright resuelve el reto JS de
          # Cloudflare/Vercel). No-fatal: si la instalación del browser falla,
          # fetch_tryhackme degrada solo al catálogo en disco y el build sigue.
          python -m playwright install --with-deps chromium || \
            echo "::warning::playwright browser install falló; TryHackMe degradará al catálogo en disco"

      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: data/_cache
          # Cache key cambia con la fecha — refresca semanalmente para
          # purgar entradas que ya hayan expirado por TTL.
          key: htb-pipeline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            htb-pipeline-cache-${{ runner.os }}-

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Run pipeline
        env:
          # Si en algún momento conseguís el token, configurad el secret
          # HTB_API_TOKEN en Settings → Secrets and variables → Actions.
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
        run: |
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            python -m scripts.pipeline --no-cache
          else
            python -m scripts.pipeline
          fi

      - name: Compute changelog
        id: changelog
        run: |
          summary=$(python -m scripts.changelog)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "Cambios detectados: $summary"

      - name: Commit & push if there are changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/machines.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios: nada que commitear"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          # Tag de backup ANTES del commit, apuntando al estado anterior.
          # Si el refresh introduce un bug, `git checkout backup-prev-refresh-YYYY-MM-DD`
          # devuelve al último estado bueno conocido.
          git tag "backup-prev-refresh-${today}" HEAD
          git commit -m "Refresh ${today}: ${{ steps.changelog.outputs.summary }}"
          git push
          # El tag de backup es una conveniencia para rollback. Si ya existe
          # (p.ej. un segundo run el mismo día), `git push --tags` lo rechaza:
          # NO debe tumbar el job — el backup del día ya está creado.
          git push --tags || echo "::warning::tag backup-prev-refresh-${today} ya existe (¿re-run el mismo día?); continúo"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Purge Cloudflare cache
        if: steps.commit.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          # Tras publicar el refresh purgamos la caché del edge para que el HTML
          # cacheado por el Worker (cacheEverything, TTL 24 h) refleje el nuevo
          # catálogo al instante. Si faltan los secrets, avisamos y seguimos:
          # la caché se renueva sola en 24 h por TTL, así que no es fatal.
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CF_API_TOKEN/CF_ZONE_ID no configurados; omito la purga (la caché expira por TTL en 24 h)"
            exit 0
          fi
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$resp" | grep -q '"success":true'; then
            echo "Caché de Cloudflare purgada correctamente"
          else
            echo "::warning::Purga no confirmada por la API: $resp"
          fi
