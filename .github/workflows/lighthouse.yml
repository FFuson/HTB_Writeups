name: Lighthouse CI

# Performance budget contra rootea.es. Falla si:
#   - Performance < 90
#   - Accessibility < 95
#   - Best practices < 95
#   - SEO < 95
#
# Corre tras cada push a main (post-deploy de Mintlify) y semanalmente
# por cron, para detectar regresiones que vengan del propio Mintlify
# o del Cloudflare Worker.

on:
  schedule:
    - cron: "0 5 * * 2"  # martes 05:00 UTC, día siguiente al refresh
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # URLs reales, no redirecciones: `/`, `/all` y
          # `/machines/...` devuelven 308 desde el refactor a `/htb/` y
          # el audit llevaba meses midiendo redirecciones. Se auditan
          # además solo páginas indexables (ver data/seo_index.json).
          urls: |
            https://rootea.es/introduction
            https://rootea.es/htb/all
            https://rootea.es/skills/kerberoasting
            https://rootea.es/en/introduction
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ".github/workflows/lighthouse.config.json"
