[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htb-writeups-aggregator"
version = "0.1.0"
description = "Directorio curado de writeups de máquinas retiradas de Hack The Box"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# Extra opcional: la fase TryHackMe usa Playwright para resolver el reto JS de
# Cloudflare/Vercel y llamar a la API desde el browser. Es opcional — si no se
# instala, `fetch_tryhackme` degrada al catálogo en disco (no rompe el build).
# Tras instalar este extra hay que bajar el browser: `playwright install chromium`.
fetch = [
    "playwright>=1.40",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
